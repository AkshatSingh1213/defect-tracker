version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      ORACLE_HOST: ${ORACLE_HOST:-10.59.7.174}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME:-XE}
      ORACLE_USER: ${ORACLE_USER:-otm}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-welcome123}
      JWT_SECRET: change_this_in_production_please
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      APP_BASE_URL: http://localhost:3000
      PORT: 5000
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
